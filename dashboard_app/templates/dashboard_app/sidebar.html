<!-- SIDEBAR PARTIAL -->
<aside class="adm-sidebar" id="adm-sb">
  <div style="padding:24px 18px 14px">
    <a href="/" style="display:flex;align-items:center;gap:9px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M3 12L12 3L21 12V20C21 20.55 20.55 21 20 21H15V16H9V21H4C3.45 21 3 20.55 3 20V12Z" fill="var(--brand-400)"/></svg>
      <div>
        <div style="font-size:15px;font-weight:800;color:#fff;letter-spacing:-.3px">NestMatch</div>
        <div class="text-brand-500" style="font-size:10px;font-weight:700;;letter-spacing:1px;text-transform:uppercase">Admin Panel</div>
      </div>
    </a>
  </div>

  <!-- Admin chip -->
  <div style="margin:0 14px 18px;padding:13px;background:rgba(255,255,255,.08);border-radius:12px;display:flex;align-items:center;gap:10px">
    <div style="width:36px;height:36px;border-radius:50%;background:inear-gradient(135deg,var(--brand-600),var(--brand-400));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0">
      {{ request.user.first_name|first|upper }}{{ request.user.last_name|first|upper }}
    </div>
    <div style="overflow:hidden">
      <div style="font-size:13px;font-weight:700;color:#fff;white-space:nowrap">{{ request.user.full_name }}</div>
      <div style="font-size:11px;color:rgba(255,255,255,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ request.user.email }}</div>
    </div>
  </div>

  <!-- Nav -->
  <nav style="padding:0 10px;flex:1;overflow-y:hidden;display:flex;flex-direction:column">
    <div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:1.2px;text-transform:uppercase;padding:0 4px;margin-bottom:6px">MAIN</div>

    <a href="{% url 'dashboard_app:overview' %}" class="adm-nl {% if current_tab == 'overview' %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
      Overview
    </a>

    <a href="{% url 'dashboard_app:users' %}" class="adm-nl {% if current_tab == 'users' %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Users
    </a>

    <a href="{% url 'dashboard_app:listings' %}" class="adm-nl {% if current_tab == 'listings' %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3L21 12V20a1 1 0 0 1-1 1H15V15H9v6H4a1 1 0 0 1-1-1Z"/></svg>
      Listings
    </a>

    <a href="{% url 'dashboard_app:banned_users' %}" class="adm-nl {% if current_tab == 'banned' %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      Banned Users
    </a>

    <a href="{% url 'dashboard_app:messages' %}" class="adm-nl {% if current_tab == 'messages' %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      Messages
    </a>

    <a href="{% url 'dashboard_app:applications' %}" class="adm-nl {% if current_tab == 'applications' %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Applications
    </a>

    <a href="{% url 'dashboard_app:verification' %}" class="adm-nl {% if current_tab == 'verification' %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 8-7 9c-3.5-1-7-4-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
      Verification
    </a>

    <a href="{% url 'dashboard_app:reviews' %}" class="adm-nl {% if current_tab == 'reviews' %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Reviews
    </a>

    <a href="{% url 'dashboard_app:site_content' %}" class="adm-nl {% if current_tab == 'site-content' %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Site Content
    </a>

    <div style="height:1px;background:rgba(255,255,255,.08);margin:12px 0"></div>
    <div style="font-size:10px;font-weight:700;color:rgba(255, 255, 255, 0.8);letter-spacing:1.2px;text-transform:uppercase;padding:0 4px;margin-bottom:6px">SYSTEM</div>
    <a href="{% url 'dashboard_app:settings' %}" class="adm-nl {% if current_tab == 'settings' %}active{% endif %}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>

    <a href="/" class="adm-nl">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      View Site
    </a>
  </nav>

  <div style="padding:14px 10px">
    <a href="/auth/logout/" class="adm-nl" style="color:rgba(255,255,255,.9)"
       onmouseenter="this.style.background='rgba(239,68,68,.12)';this.style.color='#FCA5A5'"
       onmouseleave="this.style.background='transparent';this.style.color='rgba(255,255,255,.45)'">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </a>
  </div>
</aside>
<div class="adm-sidebar-overlay" id="adm-ov" onclick="admToggle()"></div>
