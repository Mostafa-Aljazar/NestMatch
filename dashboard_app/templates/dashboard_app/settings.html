{% block title %}Settings - NestMatch Admin{% endblock %}

{% block page_title %}Settings{% endblock %}

{% block content %}
<div style="margin-bottom:20px"><h2 style="font-size:20px;font-weight:800;color:#111827">Platform Settings</h2></div>
<div class="adm-card">
  <div class="adm-section-title">General</div>
  <div style="display:flex;flex-direction:column;gap:16px">
    <div><label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px">Platform Name</label><input type="text" value="NestMatch" class="adm-input" style="width:100%;max-width:360px"></div>
    <div><label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px">Support Email</label><input type="email" value="hello@nestmatch.io" class="adm-input" style="width:100%;max-width:360px"></div>
    <div><label style="font-size:13px;font-weight:600;color:#374151;display:block;margin-bottom:6px">Max Listing Photos</label><input type="number" value="10" class="adm-input" style="width:120px"></div>
  </div>
  <button style="margin-top:20px;padding:11px 28px;font-size:13px;font-weight:700;color:#fff;background:#7C3AED;border:none;border-radius:8px;cursor:pointer;font-family:inherit">Save Settings</button>
</div>
{% endblock %}
