{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%23EA580C%22/><path d=%22M17 30L32 16L47 30V50C47 51.5 45.8 52.7 44.3 52.7H37V40H27V52.7H19.7C18.2 52.7 17 51.5 17 50V30Z%22 fill=%22white%22/></svg>">
  <title>Page Not Found | NestMatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% include "core_app/partials/tailwind_config.html" %}
    <link rel="stylesheet" href="{% static 'core_app/css/theme.css' %}">
    

  <style>
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .float-anim { animation: float 4s ease-in-out infinite; }
    @keyframes blobDrift {
      0%   { transform: translate(0,0) scale(1); }
      33%  { transform: translate(-4%,6%) scale(1.08); }
      66%  { transform: translate(5%,-4%) scale(0.95); }
      100% { transform: translate(0,0) scale(1); }
    }
    .blob { animation: blobDrift 14s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen bg-brand-50 flex items-center justify-center p-6 overflow-hidden">

  <!-- Background blobs -->
  <div class="blob pointer-events-none fixed -top-24 -left-24 h-72 w-72 rounded-full bg-brand-200/40 blur-3xl"></div>
  <div class="blob pointer-events-none fixed -bottom-24 -right-24 h-80 w-80 rounded-full bg-violet-300/30 blur-3xl" style="animation-delay:-6s"></div>

  <div class="relative w-full max-w-lg text-center">

    <!-- Logo -->
    <a href="/" class="inline-flex items-center gap-2 mb-10 no-underline">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-600 shadow-sm">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M3 12L12 3L21 12V20C21 20.55 20.55 21 20 21H15V16H9V21H4C3.45 21 3 20.55 3 20V12Z" fill="white"/>
        </svg>
      </div>
      <span class="text-[19px] font-extrabold tracking-tight">
        <span class="text-gray-900">Nest</span><span class="hover:bg-brand-50">Match</span>
      </span>
    </a>

    <!-- Illustration -->
    <div class="float-anim mx-auto mb-8 flex h-32 w-32 items-center justify-center rounded-[28px] bg-gradient-to-br from-brand-600 via-brand-500 to-brown-600 shadow-xl shadow-brand-200">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 22V12h6v10"/>
        <path d="M3 10.5 12 3l9 7.5"/>
        <circle cx="12" cy="12" r="9.5" stroke-opacity="0"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/>
        <line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>
    </div>

    <p class="mb-2 text-sm font-bold uppercase tracking-[0.2em] text-brand-500">Error 404</p>
    <h1 class="mb-3 text-3xl font-extrabold tracking-tight text-gray-900 sm:text-4xl">This room doesn't exist</h1>
    <p class="mx-auto mb-8 max-w-sm text-[15px] leading-relaxed text-gray-500">
      The page you're looking for may have moved, been taken down, or never existed. Let's get you back on track.
    </p>

    <div class="flex flex-col items-center gap-3 sm:flex-row sm:justify-center">
      <a href="/" class="w-full sm:w-auto rounded-lg bg-brand-600 px-6 py-3 text-sm font-bold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-brand-700 hover:shadow-lg hover:shadow-brand-200">
        Back to Home
      </a>
      <a href="/rooms/" class="w-full sm:w-auto rounded-lg border border-brand-200 px-6 py-3 text-sm font-bold hover:bg-brand-50 transition hover:-translate-y-0.5 hover:border-brand-300 hover:bg-brand-50">
        Browse Listings
      </a>
    </div>

  </div>

</body>
</html>
